# Egress lockdown for the executor pool.
#
# The executor is the one pod that runs code written by students. Left alone it
# could reach the database, the API, the cloud LLM key's endpoint, or Azure's
# instance metadata service at 169.254.169.254 — which hands out managed
# identity tokens. It needs exactly two things: DNS, and Redis.
#
# Requires a policy engine on the cluster. Terraform sets network_policy =
# "calico"; on a cluster without one these objects apply cleanly and do nothing.
# Verify with the exec test in the Phase 3 checklist rather than assuming.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: executor-egress
  namespace: simulyn
spec:
  podSelector:
    matchLabels:
      app: executor
  policyTypes: [Egress]
  egress:
    # DNS. kube-dns lives in kube-system, so this needs a namespace selector —
    # the label below is applied automatically by Kubernetes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Redis, and only Redis.
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
# Ingress side: nothing needs to reach the executor except kubelet's probes,
# which come from the node and are not subject to NetworkPolicy. The Service
# exists for those probes and for debugging via port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: executor-ingress
  namespace: simulyn
spec:
  podSelector:
    matchLabels:
      app: executor
  policyTypes: [Ingress]
  ingress: []
---
# Postgres accepts connections from the API only. The executor has no
# credentials, but defence in depth costs nothing here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: simulyn
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: postgres-backup
      ports:
        - protocol: TCP
          port: 5432
