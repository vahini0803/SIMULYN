apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: simulyn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: REPLACE_WITH_ACR/simulyn-web:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            # NEXT_PUBLIC_API_URL is deliberately absent: Next.js inlines
            # NEXT_PUBLIC_* at build time, so setting it here would do nothing.
            # It is passed as a --build-arg in the deploy workflow.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: simulyn
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
