kind: Secret
metadata:
  name: simulyn-secrets
  namespace: simulyn
type: Opaque
stringData:
  POSTGRES_USER: "simulyn"
  POSTGRES_PASSWORD: ""
  JWT_SECRET: ""
  JWT_REFRESH_SECRET: ""
  CLOUD_LLM_API_KEY: ""
  # The password appears twice — here and inside this URL. They must match.
  DATABASE_URL: "postgresql://simulyn:PASSWORD@postgres:5432/simulyn?schema=public"
